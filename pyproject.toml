[project]
name = "telemetrygraphpoc"
version = "0.1.0"
description = "Global Malware IOC Telemetry Graph — proof of concept"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "networkx>=3.4",
    "faker>=33.0",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]

[project.scripts]
generate = "generator.generate:main"
build-graph = "pipeline.build:main"

[tool.hatch.build.targets.wheel]
packages = ["generator", "pipeline", "api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
