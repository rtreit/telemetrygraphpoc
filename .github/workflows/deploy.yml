name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Copy frontend to wwwroot
      run: |
        if (Test-Path webapp\wwwroot) { Remove-Item -Recurse -Force webapp\wwwroot }
        Copy-Item -Recurse frontend\dist webapp\wwwroot
      shell: pwsh

    - name: Publish .NET app
      run: dotnet publish webapp/webapp.csproj -c Release -o publish

    - name: Deploy to Azure
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'multigeograph'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: publish
